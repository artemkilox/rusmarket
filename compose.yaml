services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: rusmarket
      POSTGRES_PASSWORD: rusmarket
      POSTGRES_DB: rusmarket
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "rusmarket", "-d", "rusmarket"]
      start_period: 120s
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
